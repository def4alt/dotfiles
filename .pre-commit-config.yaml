repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: taplo
        name: taplo
        entry: taplo format --
        files: \.toml$
        language: system
      # Shell sources keep their .sh extension precisely so these two can find
      # them: a file named `home/bashrc` matches neither pattern.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -s bash --
        files: ^(home|tasks)/.*\.sh$
        language: system
      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -ci -d --
        files: ^(home|tasks)/.*\.sh$
        language: system
