# Managed by mise: https://github.com/def4alt/dotfiles
#
# Herdr rewrites this file when it migrates a setting, so keep the header first
# and re-apply the rewrite by hand after a migration.
onboarding = false

# Keep the ctrl+space prefix from the tmux configuration this replaced; Herdr
# defaults to ctrl+b.
keys.prefix = "ctrl+space"

# tmux muscle memory: " splits below, % splits right.
keys.split_horizontal = 'prefix+"'
keys.split_vertical = "prefix+%"

# Panes start as login shells so they read ~/.bash_profile (macOS) or
# ~/.profile (Linux) and inherit the PATH mise sets up, rather than whatever
# the Herdr server was started with. default_shell is left unset so it follows
# $SHELL, which is already the login bash on each machine.
terminal.shell_mode = "login"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
