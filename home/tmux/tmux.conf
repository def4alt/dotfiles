# Managed by mise: https://github.com/def4alt/dotfiles

# Set explicitly rather than inherited from $SHELL: tmux resolves default-shell
# once when the server starts, so a server booted before a shell change keeps
# the old path forever. Empty default-command keeps panes as login shells, so
# they pick up ~/.bash_profile and therefore the PATH that mise sets up.
set -g default-shell /opt/homebrew/bin/bash
set -g default-command ""

set -g default-terminal "screen-256color"

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

set -g extended-keys-format csi-u
set -g extended-keys on
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"